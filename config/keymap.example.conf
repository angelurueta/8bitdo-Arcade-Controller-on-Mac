# Mapa de botones -> teclas para gip2key
# Formato: BOTON = tecla   (usa "none" para desactivar un botón)
#
# Botones: A B X Y LB RB LT RT MENU VIEW HOME LS RS
#          UP DOWN LEFT RIGHT (palanca/D-pad/stick izquierdo)
#          RUP RDOWN RLEFT RRIGHT (stick derecho)
# Teclas:  a-z 0-9 f1-f12 up down left right space return tab escape backspace
#          shift ctrl alt command rshift rctrl ralt comma period slash semicolon
#          quote minus equal leftbracket rightbracket backslash grave

UP    = up
DOWN  = down
LEFT  = left
RIGHT = right

A  = z
B  = x
X  = a
Y  = s
LB = q
RB = w
LT = e
RT = r

MENU = return
VIEW = tab
HOME = escape
LS   = none
RS   = none

RUP    = i
RDOWN  = k
RLEFT  = j
RRIGHT = l
